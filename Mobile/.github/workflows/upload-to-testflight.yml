name: Build and Upload to TestFlight

on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          brew --version || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Setup Flutter
        run: |
          set -e
          if [ ! -d "$HOME/flutter" ]; then
            git clone --depth 1 https://github.com/flutter/flutter.git $HOME/flutter
          fi
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Flutter pub get
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter pub get

      - name: Build iOS artifacts (no codesign)
        run: |
          export PATH="$HOME/flutter/bin:$PATH"
          flutter build ios --no-codesign --no-sound-null-safety

      - name: CocoaPods install
        working-directory: ios
        run: |
          if command -v pod >/dev/null 2>&1; then
            pod install --repo-update || pod install
          else
            echo "CocoaPods not installed on runner"
            exit 1
          fi

      - name: Archive with xcodebuild
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release clean archive -archivePath $GITHUB_WORKSPACE/build/Runner.xcarchive -sdk iphoneos -destination 'generic/platform=iOS' DEVELOPMENT_TEAM=${DEVELOPMENT_TEAM} CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath $GITHUB_WORKSPACE/build/Runner.xcarchive -exportOptionsPlist ios/exportOptions.plist -exportPath $GITHUB_WORKSPACE/build/Runner-ipa -allowProvisioningUpdates

      - name: Setup Ruby and Fastlane
        run: |
          gem install fastlane -NV

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "${ASC_KEY:-}" ]; then
            echo "ASC_KEY not set; ensure ASC_KEY (base64 .p8) is configured in repo secrets"
            exit 1
          fi
          mkdir -p $GITHUB_WORKSPACE/fastlane
          echo "$ASC_KEY" | base64 --decode > $GITHUB_WORKSPACE/fastlane/AuthKey_${ASC_KEY_ID}.p8
          ls -l $GITHUB_WORKSPACE/fastlane

      - name: Upload to TestFlight (fastlane)
        env:
          ASC_KEY_PATH: ${{ github.workspace }}/fastlane/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA_PATH: ${{ github.workspace }}/build/Runner-ipa/Runner.ipa
        run: |
          fastlane ios upload_to_testflight
